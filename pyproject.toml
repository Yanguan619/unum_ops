[project]
name = "unum_ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yanguan02", email = "yanguan_02@126.com" }
]
requires-python = ">=3.11, <3.12"
dynamic = ["dependencies"]

[project.scripts]
unum_ops = "unum_ops:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.unum_ops.dependencies]
base = [
    "absl-py>=2.5.0",
    "attrs>=26.1.0",
    "cffi>=2.1.1",
    "cython>=3.2.9",
    "decorator>=5.3.1",
    "easydict>=1.13",
    "matplotlib>=3.10.9",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "pre-commit>=4.6.0",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
    "torch==2.7.1",
    "torch-npu==2.7.1",
]
triton = "triton>=3.2.0"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
